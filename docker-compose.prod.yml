services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: lavoute
      MARIADB_USER: lavoute
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/clovis-p/la-voute-app:latest
    build: .
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/lavoute
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - ./.env:/app/.env:ro
      - ./data/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: ghcr.io/clovis-p/la-voute-caddy:latest
    build:
      context: .
      dockerfile: caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      BASIC_AUTH_ENABLED: ${BASIC_AUTH_ENABLED}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mariadb_prod_data:
  caddy_data:
  caddy_config:
